name: Backend CI

# Sem filtro de paths: os checks são obrigatórios na proteção de branch e um
# workflow pulado por path deixaria o check pendente, bloqueando o merge.
# Sem filtro de branches em pull_request: PRs empilhados também rodam.
on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# A versão do Python vem de .python-version. O Poetry não tem arquivo de pin: a
# versão fica aqui e no backend/Dockerfile (`make check-pins` confere).
env:
  POETRY_VERSION: "2.4.1"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: srs_tour_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d srs_tour_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    # As variáveis vêm daqui: no CI não existe backend/.env.
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/srs_tour_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/srs_tour_test
      SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache virtual environment
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: backend-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            backend-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-

      - name: Install dependencies
        run: make install-back

      - name: Versões em sincronia (.python-version, .nvmrc, Dockerfiles)
        run: make check-pins

      - name: Ruff (lint e formatação)
        run: make back-check

      - name: Uma única head de migrations
        run: make back-migration-single-head

      # O Postgres é um service do Actions (não o Compose): não usar back-test-migrate.
      - name: Migrations no banco de teste
        run: make back-test-migrate-only

      - name: Models em sincronia com as migrations
        run: make back-migration-check

      - name: Testes (pytest)
        run: make back-test

  docker:
    name: Backend Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t srs-tour-backend:ci ./backend
