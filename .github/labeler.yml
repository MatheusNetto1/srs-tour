# ==========================================
# SRS Tour - Pull Request Labeler
# ==========================================
# actions/labeler@v6 (minimatch com dot: true). Com pull_request_target, a
# action lê este arquivo da branch base: mudanças aqui só valem após o merge.

"area: backend":
  - changed-files:
      - any-glob-to-any-file:
          - "backend/**"

"area: frontend":
  - changed-files:
      - any-glob-to-any-file:
          - "frontend/**"

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

"area: docker":
  - changed-files:
      - any-glob-to-any-file:
          - "**/Dockerfile"
          - "**/Dockerfile.*"
          - "**/.dockerignore"
          - "compose.yml"
          - "compose.yaml"
          - "docker-compose.yml"
          - "docker-compose.yaml"
          - "docker/**"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

"area: tooling":
  - changed-files:
      - any-glob-to-any-file:
          - "Makefile"
          - "AGENTS.md"
          - ".claude/**"
          - ".gemini/**"
          - ".gitattributes"
          - "backend/scripts/**"
          - "backend/pyproject.toml"
          - "backend/poetry.lock"
          - "frontend/package.json"
          - "frontend/package-lock.json"
          - "frontend/biome.json"
          - "frontend/tsconfig*.json"
          - "frontend/vite.config.*"
          - "frontend/vitest.config.*"
          - "frontend/playwright*.ts"

"area: dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - "backend/pyproject.toml"
          - "backend/poetry.lock"
          - "frontend/package.json"
          - "frontend/package-lock.json"

"area: database":
  - changed-files:
      - any-glob-to-any-file:
          - "backend/app/**/models.py"
          - "backend/app/core/database.py"
          - "backend/alembic/**"
          - "backend/alembic.ini"
          - "docker/postgres/**"

"area: api":
  - changed-files:
      - any-glob-to-any-file:
          - "backend/app/**/router.py"
          - "backend/app/**/schemas.py"
          - "backend/app/api/**"
