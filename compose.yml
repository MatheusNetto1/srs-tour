services:
  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    # Em dev aplica as migrations antes de iniciar. DATABASE_URL (abaixo, host
    # `db`) tem precedência sobre o .env, que aponta para localhost.
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/srs_tour
    depends_on:
      db:
        condition: service_healthy
    # A imagem python:slim não tem curl. O start_period cobre as migrations.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Bind mount no Windows não propaga eventos de arquivo ao container.
      DEV_USE_POLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 e não localhost: no Alpine o wget resolve para ::1 e o Vite
      # escuta só em IPv4.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: srs_tour
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts executados só na primeira inicialização de um volume novo.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d srs_tour"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
