[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "MatheusNetto1", email = "netto.matheus123@outlook.com"}
]
requires-python = ">=3.12,<4.0"

dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
    "psycopg[binary] (>=3.3.5,<4.0.0)",
    "sqlalchemy (>=2.0,<3.0)",
    "alembic (>=1.16,<2.0)",
    "pydantic-settings (>=2.0,<3.0)",
    "pyjwt (>=2.0,<3.0)",
    "pwdlib[argon2] (>=0.2,<1.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[dependency-groups]
dev = [
    "ruff (>=0.16.6,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "httpx2 (>=2.13.1,<3.0.0)",
]


[tool.poetry]
package-mode = false


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.ruff]
target-version = "py312"
line-length = 88


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]